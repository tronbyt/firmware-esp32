name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: false
        default: main
        type: string
      release_tag:
        description: >-
          Git tag for the draft release (default alpha). replace_existing
          overwrites the previous draft when the tag name is reused.
        required: false
        default: alpha
        type: string
      draft:
        description: Create as draft (not public until you publish; use a token to download)
        required: true
        default: true
        type: boolean
      replace_existing:
        description: >-
          If a release (and tag) with release_tag already exists, delete it
          before uploading new binaries (safe rolling "alpha" channel).
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: espressif/idf:release-v5.5
    strategy:
      fail-fast: false
      matrix:
        target:
          - tidbyt-gen1
          - tidbyt-gen1_swap
          - tidbyt-gen2
          - tronbyt-s3
          - tronbyt-s3-wide
          - pixoticker
          - matrixportal-s3
          - matrixportal-s3-square
          - matrixportal-s3-wide
          - matrixportal-s3-waveshare
          - waveshare-s3
          - waveshare-s3-wide

    env:
      IDF_CCACHE_ENABLE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.target }}-${{ hashFiles('**/sdkconfig.defaults*') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.target }}-

      - name: Generate version header
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(git describe --tags --always --dirty | sed 's/^v//')
          elif git describe --tags --abbrev=0 2>/dev/null; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          else
            VERSION=$(git describe --always --dirty)
          fi
          echo "Firmware version: $VERSION"

          cat > main/version.h << EOF
          // Auto-generated file - DO NOT EDIT
          // Generated by GitHub Actions
          #pragma once
          #define FIRMWARE_VERSION "$VERSION"
          EOF

      - name: Build Target
        run: |
          . $IDF_PATH/export.sh
          target="${{ matrix.target }}"
          echo "--------------------------------------"
          echo "Building target: $target"
          echo "--------------------------------------"
          
          # Determine chip type based on target
          case "$target" in
            *s3*|*S3*)
              chip="esp32s3"
              ;;
            *)
              chip="esp32"
              ;;
          esac

          BUILD_DIR="build_$target"

          # Set the target and apply sdkconfig defaults
          idf.py -B "$BUILD_DIR" -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.$target" set-target "$chip"
          idf.py -B "$BUILD_DIR" build

          if [ ! -f "$BUILD_DIR/firmware.bin" ]; then
            echo "❌ Failed to generate firmware for $target"
            exit 1
          fi

          # Generate merged binary
          echo "Generating merged binary for $chip..."
          # Run esptool from within the build directory so relative paths in flash_args work
          (cd "$BUILD_DIR" && python -m esptool --chip "$chip" merge_bin -o "merged_firmware.bin" @flash_args)

          # Rename for artifact upload
          mv "$BUILD_DIR/firmware.bin" "${target}_firmware.bin"
          mv "$BUILD_DIR/merged_firmware.bin" "${target}_merged.bin"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}_firmware
          path: |
            ${{ matrix.target }}_firmware.bin
            ${{ matrix.target }}_merged.bin
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: '*_firmware'
          merge-multiple: true

      - name: Display Artifacts
        run: ls -R release-artifacts/

      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
            if [ -z "$tag" ]; then
              tag="alpha"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            title="${GITHUB_REPOSITORY#*/} ${tag}"
            echo "title=$title" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.draft }}" = "true" ]; then
              echo "draft=1" >> "$GITHUB_OUTPUT"
            else
              echo "draft=0" >> "$GITHUB_OUTPUT"
            fi
            echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REPOSITORY#*/} ${tag#v}" >> "$GITHUB_OUTPUT"
            echo "draft=0" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          title="${{ steps.meta.outputs.title }}"
          target="${{ steps.meta.outputs.target }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.replace_existing }}" = "true" ]; then
            if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Deleting existing release and tag: $tag"
              gh release delete "$tag" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            else
              repo="${GITHUB_REPOSITORY}"
              if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                echo "Deleting orphaned tag (no release): $tag"
                gh api -X DELETE "repos/${repo}/git/refs/tags/${tag}"
              fi
            fi
          fi

          args=(
            "$tag"
            --repo="${GITHUB_REPOSITORY}"
            --title="$title"
            --generate-notes
          )
          if [ "${{ steps.meta.outputs.draft }}" = "1" ]; then
            args+=(--draft)
          fi
          if [ -n "$target" ]; then
            args+=(--target "$target")
          fi
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          gh release create "${args[@]}" "${files[@]}"
