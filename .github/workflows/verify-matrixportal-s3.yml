name: Verify MatrixPortal S3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-matrixportal-s3.yml"
      - "CMakeLists.txt"
      - "dependencies.lock"
      - "partitions.csv"
      - "sdkconfig.defaults"
      - "sdkconfig.defaults.matrixportal-s3"
      - "main/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    timeout-minutes: 30
    env:
      BUILD_DIR: build-matrixportal-s3
      IDF_CCACHE_ENABLE: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Record toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py --version | tee idf-version.txt
          python --version | tee python-version.txt

      - name: Generate deterministic version header
        run: |
          version="verify-${GITHUB_SHA::12}"
          {
            echo "// Auto-generated by the MatrixPortal S3 verification job"
            echo "#pragma once"
            echo "#define FIRMWARE_VERSION \"$version\""
          } > main/version.h

      - name: Configure and build MatrixPortal S3
        shell: bash
        run: |
          set -o pipefail
          . "$IDF_PATH/export.sh"
          idf.py -B "$BUILD_DIR" \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.matrixportal-s3" \
            set-target esp32s3 2>&1 | tee configure.log
          idf.py -B "$BUILD_DIR" build 2>&1 | tee build.log

      - name: Verify and describe artifacts
        shell: bash
        run: |
          set -o pipefail
          . "$IDF_PATH/export.sh"
          test -s "$BUILD_DIR/firmware.bin"
          test -s "$BUILD_DIR/firmware.elf"
          idf.py -B "$BUILD_DIR" size 2>&1 | tee size.log
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" \
            "$BUILD_DIR/partition_table/partition-table.bin" | tee partition-table.txt
          (
            cd "$BUILD_DIR"
            python -m esptool --chip esp32s3 merge_bin \
              -o merged_firmware.bin @flash_args
          )
          sha256sum \
            "$BUILD_DIR/firmware.bin" \
            "$BUILD_DIR/firmware.elf" \
            "$BUILD_DIR/merged_firmware.bin" | tee checksums.txt
          wc -c \
            "$BUILD_DIR/firmware.bin" \
            "$BUILD_DIR/firmware.elf" \
            "$BUILD_DIR/merged_firmware.bin" | tee artifact-sizes.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v6
        with:
          name: matrixportal-s3-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            idf-version.txt
            python-version.txt
            configure.log
            build.log
            size.log
            partition-table.txt
            checksums.txt
            artifact-sizes.txt
            build-matrixportal-s3/firmware.bin
            build-matrixportal-s3/firmware.elf
            build-matrixportal-s3/firmware.map
            build-matrixportal-s3/merged_firmware.bin
            build-matrixportal-s3/sdkconfig
